<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Botgdl3 Uptime</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#edf2ff;font:16px system-ui}.card{width:min(540px,calc(100% - 30px));padding:26px;background:#121d30;border:1px solid #293c58;border-radius:18px}p{color:#9aabc4;line-height:1.5}input{width:100%;padding:12px;background:#0b1525;border:1px solid #354761;border-radius:10px;color:white}button{margin-top:12px;padding:12px 16px;background:#3b82f6;color:white;border:0;border-radius:10px;font-weight:700}#status{margin-top:18px;padding:14px;background:#0b1525;border-radius:10px}</style></head><body><main class="card"><h1>Botgdl3 Uptime</h1><p>Ana Web Service'in /health adresini kontrol eder. Bu tarayıcı kontrolü sekme açıkken 5 dakikada bir çalışır; sekme kapalıyken arka planda çalışmaz.</p><label>Ana Web Service URL</label><input id="url" placeholder="https://botgdl3.onrender.com"><button id="save">Kaydet ve kontrol et</button><div id="status">Henüz kontrol edilmedi.</div><p>Otomatik zamanlı kontrol için GitHub Actions secret BOTGDL3_SERVICE_URL ayarlanmalıdır.</p></main><script>const i=document.getElementById("url"),s=document.getElementById("status");i.value=localStorage.getItem("botgdl3-url")||"";async function check(){let u=i.value.trim().replace(/\/$/,"");if(!u){s.textContent="Önce servis adresini gir.";return}try{let r=await fetch(u+"/health",{cache:"no-store"}),d=await r.json();if(!r.ok||!d.ok)throw Error("Yanıt geçersiz");s.textContent="Ulaşılabilir • Bot: "+d.bot+" • "+new Date(d.timestamp).toLocaleTimeString("tr-TR")}catch(e){s.textContent="Yanıt alınamadı: "+e.message}}document.getElementById("save").onclick=()=>{localStorage.setItem("botgdl3-url",i.value.trim());check()};if(i.value)check();setInterval(()=>{if(i.value.trim())check()},300000);</script></body></html>
