name: TabHide
version: 1.0.0
main: com.ytbentr.tabhide.TabHidePlugin
api-version: '1.21'
author: ytbentr
description: Oyunculari tab listesinden ve sunucu listesi sayacindan gizler.
commands:
  gizle:
    description: Kendini veya bir oyuncuyu gizler/gosterir.
    usage: /gizle [oyuncu]
    aliases: [vanish]
permissions:
  tabhide.use:
    description: Kendini gizleyip gosterebilme.
    default: op
  tabhide.others:
    description: Baska oyunculari gizleyip gosterebilme.
    default: op
