name: Build TabHide

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Paper plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Show project files
        run: |
          test -f pom.xml
          test -f src/main/resources/plugin.yml
          test -f src/main/resources/config.yml
          find src -type f -print

      - name: Build with Maven
        run: mvn -B -U clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: TabHide
          path: target/tabhide-1.0.0.jar
          if-no-files-found: error
